<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #8ec5f5; }
      #root { width: 100%; height: 100%; position: relative; }
      #three-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .ov { position: absolute; pointer-events: none; font-family: "Poppins", "Arial Black", sans-serif; font-weight: 800; }
      #caption { left: 50%; top: 76%; font-size: 140px; line-height: 1; color: #fff; letter-spacing: 2px; text-shadow: 0 0 2px #17171c, 7px 0 0 #17171c, -7px 0 0 #17171c, 0 7px 0 #17171c, 0 -7px 0 #17171c, 5px 5px 0 #17171c, -5px 5px 0 #17171c, 5px -5px 0 #17171c, -5px -5px 0 #17171c, 0 12px 18px rgba(0,0,0,0.35); white-space: nowrap; transform: translate(-50%, -50%); opacity: 0; z-index: 5; }
      #caption.hot { color: #ffd84a; }
      #stamp { left: 56px; top: 250px; display: flex; align-items: center; gap: 14px; background: #fff; border: 6px solid #17171c; border-radius: 28px; padding: 10px 28px 10px 20px; opacity: 0; z-index: 5; }
      #stampNum { font-size: 84px; color: #17171c; line-height: 1; display: inline-block; transform-origin: left center; }
      #stampDelta { position: absolute; left: 0; top: 100%; margin-top: 14px; font-size: 76px; line-height: 1; color: #fff; background: #d8363a; border: 6px solid #17171c; border-radius: 24px; padding: 6px 22px; }
      #stampDelta:empty { display: none; }
      #bubble { display: none; }
      #banner { right: 56px; top: 262px; padding: 14px 34px; background: #17171c; color: #fff; border-radius: 999px; font-size: 46px; letter-spacing: 4px; opacity: 0; z-index: 5; }
      #flash { inset: 0; background: #fff; opacity: 0; z-index: 4; }
      #ghostv { inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(216,54,58,0) 42%, rgba(216,54,58,0.55) 100%); opacity: 0; z-index: 3; }
      /* inserts (lib/mograph.js): a phone on a bedside table, the shelter clock */
      #inserts { inset: 0; z-index: 2; }
      #room { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at 30% 18%, #ffcf96 0%, #8a5a3a 32%, #2a1c18 75%); overflow: hidden; }
      #lampglow { position: absolute; left: -120px; top: -160px; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(circle, rgba(255,214,150,0.75), rgba(255,214,150,0) 70%); }
      .bok { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,226,180,0.45), rgba(255,226,180,0) 70%); }
      #bok1 { left: 700px; top: 160px; width: 260px; height: 260px; } #bok2 { left: 820px; top: 420px; width: 150px; height: 150px; } #bok3 { left: 120px; top: 520px; width: 190px; height: 190px; }
      #table { position: absolute; left: -200px; right: -200px; top: 760px; bottom: -400px; transform: perspective(1400px) rotateX(52deg); transform-origin: 50% 0;
               background: repeating-linear-gradient(92deg, #7a4f31 0px, #8b5b3a 14px, #6f462b 30px, #84573a 52px), linear-gradient(#000, #000); background-blend-mode: normal;
               box-shadow: inset 0 60px 120px rgba(0,0,0,0.45); }
      #phoneWrap { position: absolute; left: 50%; top: 52%; width: 0; height: 0; opacity: 0; perspective: 1600px; }
      #phone { position: absolute; left: -330px; top: -640px; width: 660px; height: 1280px; border-radius: 86px; background: #f4f2ee; border: 22px solid #17171c; box-shadow: 0 0 0 4px #3a3d44; transform-origin: 50% 60%; overflow: hidden; }
      #phShadow { position: absolute; left: -330px; top: -600px; width: 660px; height: 1280px; border-radius: 86px; background: rgba(0,0,0,0.5); filter: blur(40px); transform-origin: 50% 60%; }
      #notch { position: absolute; left: 50%; top: 18px; width: 170px; height: 44px; margin-left: -85px; border-radius: 22px; background: #17171c; }
      #phHeader { position: absolute; left: 0; right: 0; top: 0; height: 250px; background: #e7e3db; display: flex; align-items: flex-end; justify-content: center; gap: 26px; padding-bottom: 30px; border-bottom: 3px solid #d2cdc2; }
      #phPhoto { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 5px solid #fff; }
      #phPhoto svg { width: 100%; height: 100%; }
      #phStamp { display: flex; align-items: center; gap: 10px; background: #fff; border: 5px solid #17171c; border-radius: 24px; padding: 6px 22px 6px 14px; }
      #phNum { font-size: 64px; color: #17171c; line-height: 1; display: inline-block; transform-origin: left center; }
      #phThread { position: absolute; left: 40px; right: 40px; top: 300px; }
      #phBubble { display: inline-block; max-width: 560px; padding: 30px 40px; background: #fff; border: 5px solid #17171c; border-radius: 44px 44px 44px 10px; font-size: 56px; font-weight: 700; color: #17171c; line-height: 1.12; opacity: 0; transform-origin: 0 100%; }
      .buzz { position: absolute; top: 470px; width: 40px; height: 200px; border: 8px solid rgba(23,23,28,0.7); border-radius: 50%; opacity: 0; }
      #buzzL { left: -20px; border-right: none; border-top: none; border-bottom: none; } #buzzR { right: -20px; border-left: none; border-top: none; border-bottom: none; }
      #clockWrap { position: absolute; left: 50%; top: 42%; width: 820px; height: 820px; opacity: 0; transform: translate(-50%, -50%); filter: drop-shadow(0 40px 60px rgba(0,0,0,0.45)); }
      #clock { width: 100%; height: 100%; }
      .dbg { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 5px solid #0f0; font: 700 22px sans-serif; color: #000; z-index: 9; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-fps="30" data-start="0" data-duration="27.866" data-width="1080" data-height="1920">
      <canvas id="three-layer" class="clip" data-start="0" data-duration="27.866" data-track-index="0" data-layout-allow-overflow></canvas>
    </div>

    <script type="module">
      /* the director: it owns the clock and nothing else. Every number is in direction.js (and timing.js, from measured audio). */
      import * as THREE from "three";
      import { rbox } from "./lib/people.js";
      import { buildWorld } from "./lib/world.js";
      import { makeOverlay, applyOverlay, flashAlpha, shakeOffset, worldTime } from "./lib/fx.js";
      import { DIRECTION as D } from "./direction.js";
      import { setupLook } from "./lib/look.js";
      import { loadRig, makeActor, mixExpr, blinkAt } from "./lib/actor.js";
      import { makeInserts, applyPhone, applyClock } from "./lib/mograph.js";

      const W = 1080, H = 1920, clamp01 = (x) => Math.min(1, Math.max(0, x));
      const canvas = document.getElementById("three-layer"), rootEl = document.getElementById("root");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(W, H, false); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 300);
      const world = buildWorld(scene, D.world);
      const benchCup = new THREE.Group();
      benchCup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.034, 0.12, 20), new THREE.MeshStandardMaterial({ color: 0xf3eee4, roughness: 0.5 })));
      const bl = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.018, 20), new THREE.MeshStandardMaterial({ color: 0x3b2a22 })); bl.position.y = 0.068; benchCup.add(bl);
      const bs = new THREE.Mesh(new THREE.CylinderGeometry(0.0425, 0.0385, 0.05, 20), new THREE.MeshStandardMaterial({ color: 0xb7895a, roughness: 0.9 })); benchCup.add(bs);
      scene.add(benchCup);
      scene.traverse((o) => { if (o.isMesh) { o.updateWorldMatrix(true, false); if (new THREE.Vector3().setFromMatrixPosition(o.matrixWorld).y > 9) o.userData.noShadow = true; } });
      const look = setupLook(renderer, scene, camera, D.look, W, H);
      const closeKey = new THREE.SpotLight(0xffe2c4, 0, 7, 0.32, 0.65, 1.5); scene.add(closeKey, closeKey.target);   /* a close-up's own key: a narrow spot on the face only (a directional key lit the wall behind him evenly: critic, night v2 and v3) */
      const overlay = makeOverlay(rootEl), ins = makeInserts(rootEl);
      const dbg = D.debug ? ["lead head", "shelter", "bus front"].map((n) => { const d = document.createElement("div"); d.className = "dbg"; d.textContent = n[0].toUpperCase(); rootEl.appendChild(d); return d; }) : null;

      const J = D.cast.lead;
      let lead = null, extras = [];
      const lerpAng = (a, b, u) => { let d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * u; };
      function pathAt(path, t) {
        let i = 0; while (i < path.length - 2 && t > path[i + 1].t) i++;
        const a = path[i], b = path[i + 1], r = clamp01((t - a.t) / (b.t - a.t)), s = r * r * (3 - 2 * r), u = r + (s - r) * (b.ease ?? 0.6);   /* eased: no instant starts, stops or turns */
        return { x: a.x + (b.x - a.x) * u, z: a.z + (b.z - a.z) * u, yaw: lerpAng(a.yaw, b.yaw, s) };
      }
      function faceAt(keys, t) {
        let i = 0; while (i < keys.length - 1 && t >= keys[i + 1].t) i++;
        const cur = keys[i], prev = keys[i - 1] || cur, u = clamp01((t - cur.t) / (cur.blend ?? 0.18));
        const lk = [0, 1].map((k) => prev.look[k] + (cur.look[k] - prev.look[k]) * u);
        return { e: mixExpr(prev.expr, cur.expr, u), look: lk };
      }
      const ease = (s, r) => { const e = s.ease || "inOut"; return e === "out" ? 1 - (1 - r) ** 3 : e === "in" ? r ** 3 : r < 0.5 ? 4 * r ** 3 : 1 - (-2 * r + 2) ** 3 / 2; };
      function shotAt(T, tw) {
        const s = D.shots.find((s) => T >= s.t0 && T < s.t1) || D.shots[D.shots.length - 1];
        if (s.kind === "phone" && !s.from) return { s };
        if (s.follow) {                                                    /* a follow shot: the camera keeps a fixed offset from the lead */
          const p = pathAt(J.path, tw), f = s.follow, hh = D.camera?.handheld ?? 0, ph = T * 0.9;
          return { s, pos: [p.x + f.offset[0] + Math.sin(ph) * hh, f.camY, p.z + f.offset[1]], look: [p.x, f.lookY, p.z + f.lookAhead], fov: s.fov ?? 32 };
        }
        const u = ease(s, clamp01((T - s.t0) / (s.t1 - s.t0)));
        const l = (a, b) => a.map((v, i) => v + (b[i] - v) * u);
        const f0 = s.from.fov ?? s.fov ?? 32, f1 = s.to.fov ?? s.fov ?? 32;
        const hh = D.camera?.handheld ?? 0, ph = T * 0.9 + s.t0 * 3.1, dr = [Math.sin(ph) * hh, Math.sin(ph * 1.37 + 1.1) * hh * 0.7, 0];
        return { s, pos: l(s.from.pos, s.to.pos).map((v, i) => v + dr[i]), look: l(s.from.look, s.to.look), fov: f0 + (f1 - f0) * u };
      }

      function renderAt(T) {
        const ghost = D.effects.ghost.find((g) => T >= g.at && T < g.at + g.dur);
        const tw = ghost ? ghost.showTime : worldTime(D.effects, T);           /* the ghost is a FROZEN frame of the future */
        const shot = shotAt(T, tw);
        world.update(tw, { noFrag: !!ghost });

        /* the lead */
        if (ghost) {
          const g = ghost.lead;
          lead.root.position.set(g.x, g.lift ?? 0, g.z); lead.root.rotation.set(0, g.yaw, 0); lead.root.rotateX(g.tilt ?? 0); lead.root.rotateZ(g.roll ?? 0);   /* thrown: off his feet */
          lead.perform(0, [{ t: 0, clip: g.clip, from: g.from, rate: 0, loop: false }]);
          lead.face(mixExpr(g.expr, g.expr, 1), false, g.look); lead.props(false, false);
        } else {
          const p = pathAt(J.path, tw);
          lead.root.position.set(p.x, 0, p.z); lead.root.rotation.set(0, p.yaw, 0);
          lead.perform(tw, J.anim);
          lead.gesture(tw, J.gestures);
          const f = faceAt(J.face, tw); lead.face(f.e, blinkAt(tw, J.seed), f.look);
          const phoneOn = J.phoneInHand ? tw >= J.phoneInHand[0] && tw < J.phoneInHand[1] : (J.gestures || []).some((gk) => gk.kind === "phone" && tw >= gk.t0 + 0.1 && tw < gk.t1 - 0.1);
          lead.props(tw >= J.cupInHand[0] && tw < J.cupInHand[1], phoneOn);
        }
        lead.outline(!!ghost);
        /* the cup: on the bench until the hit, then it rolls out of the wreckage */
        const rc = D.cup.roll, ru = clamp01((tw - rc.t0) / (rc.t1 - rc.t0)), rk = 1 - (1 - ru) ** 2;
        if (tw < J.cupInHand[1] || (tw >= D.world.impactT && tw < rc.t0)) benchCup.visible = false;
        else if (tw < D.world.impactT) { benchCup.visible = true; benchCup.position.set(...D.cup.bench); benchCup.rotation.set(0, 0, 0); }
        else { benchCup.visible = true; benchCup.position.set(...rc.from.map((v, i) => v + (rc.to[i] - v) * rk)); benchCup.position.y = 0.045; benchCup.rotation.set(0, 0.5, Math.PI / 2); benchCup.rotateY(-rk * 9); }   /* lying on its side, rolling about its own axis */
        /* passers-by */
        extras.forEach(({ a, e }) => {
          const span = 36, x = ((e.x0 + tw * e.speed * e.dir + 18) % span + span) % span - 18;
          a.root.visible = !ghost && !(e.hide || []).some(([s, t]) => tw >= s && tw < t);
          a.root.position.set(x, 0, e.z); a.root.rotation.y = e.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
          a.perform(tw + e.seed, [{ t: 0, clip: "Walk_Loop", rate: e.speed / 0.97 }]);
          a.face(mixExpr("neutral", "neutral", 1), blinkAt(tw, e.seed), [0, 0]);
        });

        /* camera, or an insert */
        const phoneOn = shot.s.kind === "phone", streetBehind = !phoneOn || shot.s.bg === "blur";
        if (streetBehind) {
          const [sx, sy] = shakeOffset(D.effects, T);
          camera.fov = shot.fov; camera.updateProjectionMatrix();
          camera.position.set(shot.pos[0] + sx, shot.pos[1] + sy, shot.pos[2]); camera.lookAt(shot.look[0] + sx * 0.6, shot.look[1] + sy * 0.6, shot.look[2]);
          camera.updateMatrixWorld();
        }
        if (shot.s.faceKey && !ghost) {
          const hp = lead.bones.Head.getWorldPosition(new THREE.Vector3()), fo = shot.s.faceKey.offset;
          closeKey.position.set(hp.x + fo[0], hp.y + fo[1], hp.z + fo[2]); closeKey.target.position.copy(hp); closeKey.intensity = shot.s.faceKey.intensity * 5;
        } else closeKey.intensity = 0;
        canvas.style.opacity = streetBehind ? 1 : 0;
        const blurred = shot.s.kind === "clock" || (phoneOn && shot.s.bg === "blur");
        canvas.style.filter = blurred ? `blur(${shot.s.blur}px) brightness(0.75)` : "none";
        canvas.style.transform = blurred ? "scale(1.06)" : "none";   /* a blur samples past the edge: scaling up hides the pale rim */
        const P = D.inserts.phone, phoneShot = phoneOn ? { ...P, t0: shot.s.t0, t1: shot.s.t1, bg: shot.s.bg } : null;
        applyPhone(ins, T, phoneShot ? { ...phoneShot, push: P.push.map((v) => v) } : null);
        applyClock(ins, T, D.inserts.clocks.find((c) => T >= c.t0 && T < c.t1));
        applyOverlay(overlay, T, D.text, ghost ? 1 : 0);
        overlay.stamp.style.opacity = phoneOn ? 0 : overlay.stamp.style.opacity;      /* never both: phone header OR corner */
        overlay.flash.style.opacity = flashAlpha(D.effects, T);
        if (dbg) {
          const pts = [new THREE.Vector3(lead.root.position.x, 1.75, lead.root.position.z), new THREE.Vector3(world.SH.x, 1.2, world.SH.z), world.busFront(tw)];
          pts.forEach((p, i) => { const v = p.clone().project(camera), off = Math.abs(v.x) > 1 || Math.abs(v.y) > 1 || v.z > 1;
            dbg[i].style.left = ((v.x + 1) / 2 * W) + "px"; dbg[i].style.top = ((1 - v.y) / 2 * H) + "px"; dbg[i].style.borderColor = off ? "#f00" : "#0f0"; });
        }
        if (streetBehind) look.render(T, ghost ? 1 : 0);
      }

      /* setup is one promise; every seek waits for it (HyperFrames buildReady, registry/examples/path-traced-3d) */
      const ready = (async () => {
        const rig = await loadRig("assets/ual/UAL1_Standard.glb");
        lead = makeActor(rig, J.look); scene.add(lead.root);
        extras = D.extras.map((e) => { const a = makeActor(rig, e.look); scene.add(a.root); return { a, e }; });
      })();
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady["scene01"] = ready;
      window.__lab = { get lead() { return lead; }, renderAt, THREE, D };   /* inspection only (debugging in a browser); does not affect frames */
      let queue = ready;
      window.addEventListener("hf-seek", (e) => {
        const time = e.detail.time;
        queue = queue.catch(() => {}).then(() => ready).then(() => renderAt(time));
        e.detail.waitUntil?.(queue);
      });
      ready.then(() => renderAt(window.__hfThreeTime || 0)).catch((err) => { console.error(err); throw err; });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true }); window.__timelines["main"] = tl; tl.seek(0);
    </script>
  </body>
</html>
