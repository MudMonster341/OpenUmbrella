        const pd = pole.clone().sub(S); pd.sub(dir.clone().multiplyScalar(pd.dot(dir))).normalize();

        turn(up, E.clone().sub(S), Ep.clone().sub(S), w);

      function wave(a, T, wv) {

      function placeCast(tw, ghost, vision) {

            a.perform(0, [{ t: 0, clip: g.clip, from: g.from, rate: 0, loop: false }]);

      }

      function renderAt(T) {
        const ghost = D.effects.ghost.find((g) => T >= g.at && T < g.at + g.dur);

        world.update(tw, { noFrag: !!ghost }); sets.update(tw);

        else if (tw < D.world.impactT) { benchCup.visible = true; benchCup.position.set(...D.cup.bench); benchCup.rotation.set(0, 0, 0); }
        else { benchCup.visible = true; benchCup.position.set(...rc.from.map((v, i) => v + (rc.to[i] - v) * rk)); benchCup.position.y = 0.045; benchCup.rotation.set(0, 0.5, Math.PI / 2); benchCup.rotateY(-rk * 9); }   /* lying on its side, rolling about its own axis */

        if (streetBehind) {

          camera.fov = shot.fov; camera.updateProjectionMatrix();
          camera.position.set(shot.pos[0] + sx, shot.pos[1] + sy, shot.pos[2]); camera.lookAt(shot.look[0] + sx * 0.6, shot.look[1] + sy * 0.6, shot.look[2]);
          camera.updateMatrixWorld();
        }
        if (shot.s.faceKey && !ghost) {
          const hp = lead.bones.Head.getWorldPosition(new THREE.Vector3()), fo = shot.s.faceKey.offset;
          closeKey.position.set(hp.x + fo[0], hp.y + fo[1], hp.z + fo[2]); closeKey.target.position.copy(hp); closeKey.intensity = shot.s.faceKey.intensity * 5;
        } else closeKey.intensity = 0;
        canvas.style.opacity = streetBehind ? 1 : 0;
        const blurred = shot.s.kind === "clock" || (phoneOn && shot.s.bg === "blur") || (insOn && shot.s.blur > 0);
        canvas.style.filter = blurred ? `blur(${shot.s.blur}px) brightness(${shot.s.dim ?? 0.75})` : "none";
        canvas.style.transform = blurred ? "scale(1.06)" : "none";   /* a blur samples past the edge: scaling up hides the pale rim */
        const P = shot.s.phone || D.inserts.phone, phoneShot = phoneOn ? { ...P, t0: shot.s.t0, t1: shot.s.t1, bg: shot.s.bg, push: P.push.map((v) => v) } : null;
        applyPhone(ins, T, phoneShot);
        if (phoneShot) {                                                                       /* L19: the thumb leaves, the screen goes dark, the number stays */
          const tl = P.thumbLeave, dk = P.dark;
          thumbEl.style.transform = tl ? `translate(${-460 * easeIO((T - tl.t0) / (tl.t1 - tl.t0))}px, ${180 * easeIO((T - tl.t0) / (tl.t1 - tl.t0))}px) rotate(-26deg)` : "";

        applyClock(ins, T, D.inserts.clocks.find((c) => T >= c.t0 && T < c.t1));
        const Nw = act(D.inserts.numbers, T); applyNumber(ins, T, Nw);
