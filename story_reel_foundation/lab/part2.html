        const blurred = s.kind === "phone" || s.kind === "insert";

        applyPhone(ins, T, s.kind === "phone" ? { ...s.phone, t0: s.t0, t1: s.t1, bg: "blur" } : null);
        applyMe(ins, T, s.insert === "me" ? { t0: s.t0, t1: s.t1, damage: s.me.damage } : null);
        applyEndCard(ins, T, s.insert === "end" ? { t0: s.t0, t1: s.t1 + 1, dim: 0.2 } : null);   /* a lighter wash (V11) */
        /* the big number: 412 races up to 812 and locks; +400 slams in on 'paid' */
        const B = D.big, bOn = s.insert === "big"; big.style.opacity = bOn ? clamp01((T - s.t0) / 0.12) : 0;
        if (bOn) { const Tq = Math.floor(T * 10) / 10, u = clamp01((Tq - B.raceAt) / (B.landAt - B.raceAt)), v = Math.round((B.from - 2 + (B.to - B.from) * (1 - (1 - u) ** 3)) / 10) * 10 + 2;   /* stepped at 10 Hz: a number that changes every frame measured as judder (V7, v1) */ bigNum.textContent = fmt(v);
          const lz = T - B.landAt; bigNum.style.transform = `scale(${lz >= 0 && lz < 0.3 ? 1 + 0.08 * Math.sin(Math.PI * lz / 0.3) : 1}) rotate(${Math.sin(T * 1.4) * 1.2}deg)`;
          const c = T - B.chipAt; bigChip.textContent = B.chip; bigChip.style.opacity = clamp01(c / 0.1); bigChip.style.transform = `scale(${c >= 0 ? 0.4 + 0.6 * back(c / 0.3) : 0.4}) rotate(${-4 + Math.sin(T * 2) * 1.5}deg)`; }
        /* the days meter */
        const Mt = D.meter, mOn = !Mt.hide.some(([a, b]) => act(a, b, T)) && s.insert !== "big";
        meter.style.opacity = mOn ? 1 : 0;
        if (mOn) { const st = [...Mt.steps].reverse().find((x) => T >= x[0]); mNum.textContent = fmt(st[1]);
          const g = clamp01((T - Mt.goalAt) / 0.4); mGoal.style.opacity = g; mBar.style.opacity = g; mBar.style.display = g > 0 ? "block" : "none"; mGoal.style.display = g > 0 ? "inline" : "none";
          mFill.style.width = (100 * Math.min(1, st[1] / 2000)).toFixed(2) + "%";
          const dt = T - st[0], ch = st[2] && dt < 1.3; mChip.textContent = ch ? st[2] : ""; mChip.style.opacity = ch ? clamp01(dt / 0.15) * (1 - clamp01((dt - 0.9) / 0.4)) : 0;
          mChip.style.background = st[2] && st[2][0] === "+" ? "#2fbf5a" : "#d8363a"; mChip.style.transform = `scale(${ch ? 0.5 + 0.5 * back(dt / 0.3) : 0.5})`;
          mNum.style.transform = `scale(${dt < 0.3 && st[2] ? 1 + 0.18 * Math.sin(Math.PI * dt / 0.3) : 1})`;
          meter.style.boxShadow = `0 0 ${24 + 8 * Math.sin(T * 3.2)}px 6px rgba(255,166,48,${(0.45 + 0.15 * Math.sin(T * 3.2)).toFixed(3)}), 0 10px 22px rgba(0,0,0,0.32)`; }
        /* the two cards: card one on L16, card two on L17; both leave for the end card */
        const C = D.cards, out = 1 - clamp01((T - C.t1) / 0.2);
        const ca = T >= C.a.t0 ? easeOut((T - C.a.t0) / 0.4) * out : 0, cb = T >= C.b.t0 ? easeOut((T - C.b.t0) / 0.4) * out : 0;
        cA.style.opacity = (ca * (1 - 0.5 * cb)).toFixed(3); cB.style.opacity = cb.toFixed(3);
        cA.style.transform = `translateY(${(1 - ca) * -70 + Math.sin(T * 1.5) * 8}px) rotate(${Math.sin(T * 1.2) * 1.2 - 2}deg) scale(${0.88 + 0.12 * ca - 0.06 * cb})`;
        cB.style.transform = `translateY(${(1 - cb) * -70 + Math.sin(T * 1.5 + 2) * 8}px) rotate(${Math.sin(T * 1.2 + 1) * 1.2 + 2}deg) scale(${0.88 + 0.12 * cb})`;
        applyOverlay(overlay, T, { stamp: [], captions: D.captions, bubbles: [], banner: [] }, 0);
        overlay.flash.style.opacity = 0;
        look.render(T, 0);
      }

      const ready = (async () => {
        const rig = await loadRig("assets/ual/UAL1_Standard.glb");
        for (const [k, r] of Object.entries(roles)) { actors[k] = makeActor(rig, r.look); scene.add(actors[k].root); }
      })();
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady["part2"] = ready;
      window.__lab = { actors, renderAt, THREE, D, scene, renderer, look, camera };   /* scene/renderer/look/camera: for bench_frame.mjs */
      let queue = ready;
      window.addEventListener("hf-seek", (e) => { const time = e.detail.time; queue = queue.catch(() => {}).then(() => ready).then(() => renderAt(time)); e.detail.waitUntil?.(queue); });
      ready.then(() => renderAt(window.__hfThreeTime || 0)).catch((err) => { console.error(err); throw err; });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true }); window.__timelines["main"] = tl; tl.seek(0);
    </script>
