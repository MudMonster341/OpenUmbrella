<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      :root { --ground: #07080a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; }
      #three-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      /* Vignette: low-key work needs the corners pulled down or the frame
         edges read as flat black panels rather than darkness. */
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 78% 58% at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.34) 80%, rgba(0,0,0,0.62) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="35.33" data-width="1080" data-height="1920">
      <canvas id="three-layer" class="clip" data-start="0" data-duration="35.33" data-track-index="0" data-layout-allow-overflow></canvas>
      <div id="vignette" class="clip" data-start="0" data-duration="35.33" data-track-index="1"></div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { OneCam } from "./lib/onecam.js";

      /* Authoring source of truth: engine/onecam/zombie-p1.beats.json.
         Inlined because the Three adapter forbids fetching at seek time. */
      const SHEET = {
        title: "Zombie Apocalypse Part 1 - The Ration",
        fps: 30,
        /* Interiors need a much smaller drift than the auto-derived value.
           At 0.129 u/s a 5.5s hold pushes the camera 0.7m INTO whatever it is
           looking at — measured: under the table at 17s, inside the lamp at
           22s, inside a wall at 9s and 14s. */
        holdDrift: 0.07,
        beats: [
          /* Pass 3 - structural. The camera now stays on an arc in FRONT of
             everything (z >= 1.3) and looks across the room, instead of
             moving through a cluttered 5m box. Closeness comes from a longer
             lens, not from flying nearer: fov 26-30 at 1.5-2m compresses and
             reads as cinema, where fov 40 at 1m reads as macro. */
          { name: "window",    position: [0.1, 1.8, 1.7],   lookAt: [0, 1.7, -2.5],    fov: 40, hold: 4.0 },
          { name: "find-them", position: [-0.2, 1.7, 3.0],  lookAt: [0, 1.15, -0.1],   fov: 58, hold: 4.5 },
          { name: "shelf",     position: [1.3, 1.7, 1.9],   lookAt: [3.4, 1.3, -0.9],  fov: 42, hold: 5.0 },
          { name: "hands",     position: [0.15, 1.9, 1.9],  lookAt: [0.05, 0.85, -0.2],fov: 40, hold: 5.5 },
          { name: "the-look",  position: [0.35, 1.45, 1.25],lookAt: [0.75, 1.3, 0.05], fov: 28, hold: 5.5 },
          { name: "the-turn",  position: [-0.2, 1.65, 2.6], lookAt: [0.1, 1.35, -1.0], fov: 52, hold: 3.5 },
        ],
      };

      const W = 1080, H = 1920;
      const cam = new OneCam(SHEET, { fps: 30 });

      const canvas = document.getElementById("three-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);

      /* ANIMATION_STANDARD R1/R2: shadows and tone mapping are the two biggest
         "is this real" levers, and both were missing from the Paris film. */
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.NeutralToneMapping ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05060a);
      const camera = new THREE.PerspectiveCamera(45, W / H, 0.05, 60);

      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(20261113);

      const mat = (hex, rough = 0.9, metal = 0.0) =>
        new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal });

      /* ---------------- the room ---------------- */
      const WALL = mat(0x4a4038, 0.95);
      const FLOOR = mat(0x3a332c, 0.9);

      function box(w, h, d, m, x, y, z, rx = 0, ry = 0) {
        const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
        o.position.set(x, y, z); o.rotation.x = rx; o.rotation.y = ry;
        o.castShadow = true; o.receiveShadow = true;
        scene.add(o); return o;
      }

      /* Bigger room. The 5m box could not hold a moving camera and furniture
         at the same time: every hold ended inside something. */
      const floor = box(8.4, 0.1, 6.4, FLOOR, 0, -0.05, 0.5); floor.castShadow = false;
      box(8.4, 0.1, 6.4, mat(0x2a241f, 0.95), 0, 3.05, 0.5);      // ceiling
      box(0.12, 3.1, 6.4, WALL, -4.05, 1.55, 0.5);                // left wall
      box(0.12, 3.1, 6.4, WALL, 4.05, 1.55, 0.5);                 // right wall
      box(8.4, 3.1, 0.12, WALL, 0, 1.55, 3.55);                   // wall behind camera

      /* Back wall built in four pieces AROUND the opening. The first pass
         used one solid box and put the glowing plate behind it, so the
         "window" was a lamp-lit wall and the cold light never existed. */
      const WIN = { x: 0, y: 1.7, w: 1.4, h: 1.1, z: -2.5 };
      const wl = WIN.x - WIN.w / 2, wr = WIN.x + WIN.w / 2;
      const wb = WIN.y - WIN.h / 2, wt = WIN.y + WIN.h / 2;
      box(4.2 + wl, 3.1, 0.12, WALL, (-4.2 + wl) / 2, 1.55, -2.55);       // left of hole
      box(4.2 - wr, 3.1, 0.12, WALL, (4.2 + wr) / 2, 1.55, -2.55);        // right of hole
      box(WIN.w, wb, 0.12, WALL, WIN.x, wb / 2, -2.55);                   // below
      box(WIN.w, 3.1 - wt, 0.12, WALL, WIN.x, (3.1 + wt) / 2, -2.55);     // above

      /* the opening: a cold plate, now actually visible through the hole */
      const outside = new THREE.Mesh(
        new THREE.PlaneGeometry(WIN.w, WIN.h),
        new THREE.MeshBasicMaterial({ color: 0x8fb0d4 })
      );
      outside.position.set(WIN.x, WIN.y, WIN.z - 0.14);
      scene.add(outside);

      /* boards across it — the gaps are the whole lighting idea */
      const BOARD = mat(0x5b4a38, 0.95);
      const boardYs = [-0.44, -0.15, 0.16, 0.46];
      for (const dy of boardYs) {
        const b = box(WIN.w + 0.38, 0.19, 0.05, BOARD, WIN.x, WIN.y + dy, WIN.z + 0.06);
        b.rotation.z = (rand() - 0.5) * 0.045;
      }
      box(0.11, WIN.h + 0.3, 0.05, BOARD, WIN.x - 0.46, WIN.y, WIN.z + 0.08);
      box(0.11, WIN.h + 0.3, 0.05, BOARD, WIN.x + 0.5, WIN.y, WIN.z + 0.08);

      /* the thing outside: a dark shape that crosses the gaps, once */
      const shape = new THREE.Mesh(
        new THREE.PlaneGeometry(0.6, 1.8),
        new THREE.MeshBasicMaterial({ color: 0x0b0f14 })
      );
      shape.position.set(-3, 1.6, WIN.z - 0.18);
      scene.add(shape);

      /* ---------------- shelf and cans ---------------- */
      const SHELF = mat(0x55473a, 0.95);
      box(0.46, 0.06, 1.7, SHELF, 3.6, 1.34, -0.9);
      box(0.46, 0.06, 1.7, SHELF, 3.6, 0.86, -0.9);

      const CAN_BODY = [mat(0x8a8f94, 0.45, 0.55), mat(0x7d8287, 0.5, 0.5), mat(0x93979b, 0.4, 0.6)];
      const CAN_LABEL = [mat(0x7a4a3a, 0.9), mat(0x5a6340, 0.9), mat(0x6b5a3a, 0.9)];
      function can(x, y, z, i) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.105, 18), CAN_BODY[i % 3]);
        body.castShadow = true; body.receiveShadow = true;
        const label = new THREE.Mesh(new THREE.CylinderGeometry(0.0425, 0.0425, 0.062, 18), CAN_LABEL[i % 3]);
        label.castShadow = true;
        g.add(body, label);
        g.position.set(x, y + 0.0525, z);
        g.rotation.y = rand() * 3;
        scene.add(g); return g;
      }
      /* three left on the shelf — READ 3 depends on them being countable */
      can(3.56, 1.37, -1.45, 0); can(3.64, 1.37, -1.26, 1); can(3.54, 1.37, -0.42, 2);

      /* ---------------- table, lamp, the two piles ---------------- */
      const TABLE = mat(0x4f4134, 0.92);
      const tableTop = box(1.6, 0.055, 0.95, TABLE, 0, 0.75, -0.2);
      for (const [lx, lz] of [[-0.72, -0.4], [0.72, -0.4], [-0.72, 0.4], [0.72, 0.4]]) {
        box(0.07, 0.75, 0.07, TABLE, lx, 0.375, -0.2 + lz);
      }

      /* the practical. One light source carries the whole film. */
      /* Back-centre of the table. At (0.52, 0.95, -0.05) the bulb sat exactly
         on the camera-to-Claude axis for READ 5 and blew the whole frame out
         with bloom. A practical must never be on the line to the subject. */
      const lampPos = new THREE.Vector3(0, 0.95, -0.44);
      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.055, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0xffd9a0 })
      );
      bulb.position.copy(lampPos); scene.add(bulb);
      box(0.1, 0.19, 0.1, mat(0x2e2a26, 0.8), lampPos.x, 0.86, lampPos.z);

      /* 9.5 cd with inverse-square falloff lit roughly a 1 m bubble and left
         four of the six reads black. Irradiance is I/r^2, so reaching the
         shelf at 1.5 m needs several times that. */
      const LAMP_CD = 34;
      const lamp = new THREE.PointLight(0xffb066, LAMP_CD, 0, 2);
      lamp.position.copy(lampPos);
      lamp.castShadow = true;
      lamp.shadow.mapSize.set(2048, 2048);   // 2048 not 4096: 7.7GB RAM, iGPU
      lamp.shadow.bias = -0.0012;
      lamp.shadow.camera.near = 0.05;
      lamp.shadow.camera.far = 9;
      scene.add(lamp);

      /* cold fill from outside, through the boards */
      const moon = new THREE.DirectionalLight(0x6f93bd, 2.6);
      moon.position.set(-0.8, 4.2, -8.5);
      moon.target.position.set(0, 1.3, 0);
      moon.castShadow = true;
      moon.shadow.mapSize.set(2048, 2048);
      moon.shadow.camera.near = 1; moon.shadow.camera.far = 14;
      moon.shadow.camera.left = -3; moon.shadow.camera.right = 3;
      moon.shadow.camera.top = 3; moon.shadow.camera.bottom = -3;
      moon.shadow.bias = -0.0015;
      scene.add(moon, moon.target);

      /* a weak warm bounce, no shadow, so the far corners are dark rather
         than absent — unlit black reads as a hole in the frame, not as night */
      const bounce = new THREE.PointLight(0xc98a56, 4.5, 0, 2);
      bounce.position.set(0, 2.5, 0.2);
      scene.add(bounce);

      /* barely-there ambient so the shadows are not pure black */
      scene.add(new THREE.HemisphereLight(0x2d3a48, 0x0c0c0f, 0.45));

      /* two piles. The human's is larger, and that is the story. */
      const TT = 0.7775; // table top
      const humanPile = [can(-0.45, TT, -0.30, 0), can(-0.37, TT, -0.08, 1), can(-0.53, TT, -0.19, 2)];
      const claudePile = [can(0.22, TT, -0.34, 1), can(0.14, TT, -0.12, 2)];
      /* the sixth, still in the middle — it moves during READ 4 */
      const movingCan = can(-0.10, TT, -0.21, 0);

      /* ---------------- the two figures ---------------- */
      function figure({ height, colour, x, z, facing }) {
        const g = new THREE.Group();
        const skin = mat(colour, 0.75);
        const u = height / 1.75;

        const hips = new THREE.Mesh(new THREE.BoxGeometry(0.28 * u, 0.2 * u, 0.18 * u), skin);
        hips.position.y = 0.92 * u;
        const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.155 * u, 0.36 * u, 4, 12), skin);
        torso.position.y = 1.2 * u;
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.05 * u, 0.06 * u, 0.09 * u, 8), skin);
        neck.position.y = 1.46 * u;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.105 * u, 18, 14), skin);
        head.position.y = 1.57 * u;
        head.scale.set(1, 1.08, 0.94);

        /* Eyes. A featureless sphere reads as a mannequin the moment it is
           big in frame, and READ 5 is a close-up. Two dark spheres and a brow
           is all a stylised character needs to be looked at. */
        const dark = new THREE.MeshStandardMaterial({ color: 0x15100e, roughness: 1.0 });
        const eye = (s) => {
          const e = new THREE.Mesh(new THREE.SphereGeometry(0.0155 * u, 10, 8), dark);
          e.position.set(s * 0.038 * u, 0.022 * u, 0.094 * u);
          return e;
        };
        /* Eyes only. Brows as separate geometry caught the lamp and read as
           two bright slabs floating on the face. */
        head.add(eye(-1), eye(1));

        const arm = (side) => {
          const a = new THREE.Group();
          const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.047 * u, 0.22 * u, 3, 8), skin);
          upper.position.y = -0.13 * u;
          const fore = new THREE.Mesh(new THREE.CapsuleGeometry(0.041 * u, 0.2 * u, 3, 8), skin);
          fore.position.y = -0.36 * u;
          a.add(upper, fore);
          a.position.set(side * 0.18 * u, 1.36 * u, 0);
          return a;
        };
        const armL = arm(-1), armR = arm(1);

        const leg = (side) => {
          const l = new THREE.Mesh(new THREE.CapsuleGeometry(0.058 * u, 0.5 * u, 3, 8), skin);
          l.position.set(side * 0.085 * u, 0.56 * u, 0);
          return l;
        };
        g.add(hips, torso, neck, head, armL, armR, leg(-1), leg(1));
        g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        g.position.set(x, 0, z);
        g.rotation.y = facing;
        scene.add(g);
        g.userData = { head, armL, armR, torso, u };
        return g;
      }

      /* Distinct silhouettes: different height, different posture. In a
         backlit room that is the only thing telling them apart. */
      /* Closer together: a 2m span needed a 70-degree lens to hold both, and
         wide lenses are what made the Paris film look cheap. */
      /* Both turned a little toward the lens. At facing -2.0 the close-up on
         READ 5 saw the BACK of Claude's head — the reaction that is the whole
         film was pointing away from camera. */
      const human = figure({ height: 1.78, colour: 0x8a8278, x: -0.78, z: 0.22, facing: 1.62 });
      const claude = figure({ height: 1.46, colour: 0xe08a63, x: 0.75, z: 0.12, facing: -1.45 });
      human.userData.armR.rotation.x = -0.55;
      human.userData.armL.rotation.x = -0.2;
      claude.userData.armL.rotation.x = -0.42;
      claude.userData.armR.rotation.x = -0.15;

      /* ---------------- post ---------------- */
      const composer = new EffectComposer(renderer);
      composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.42, 0.55, 0.88);
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      /* ---------------- per-frame ---------------- */
      const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const clamp01 = (v) => Math.min(1, Math.max(0, v));

      function renderAt(time) {
        const frame = time * SHEET.fps;
        cam.apply(camera, frame);
        const b = cam.beatAt(frame) ?? { index: 0, phase: "hold", local: 0 };

        /* breathing — nothing in this room is ever perfectly still */
        for (const f of [human, claude]) {
          const ph = f === human ? 0 : 1.9;
          f.userData.torso.position.y = f.userData.u * 1.2 + Math.sin(time * 1.15 + ph) * 0.004;
          f.userData.head.position.y = f.userData.u * 1.57 + Math.sin(time * 1.15 + ph) * 0.005;
        }

        /* READ 1 — the shape crosses the window once, during beat 0's hold */
        if (b.index === 0 && b.phase === "hold") {
          const p = clamp01((b.local - 0.34) / 0.3);
          shape.position.x = -1.5 + p * 3.0;
          shape.visible = p > 0 && p < 1;
        } else {
          shape.visible = false;
        }

        /* READ 4 — the last can is moved to the human's pile. Silent. */
        if (b.index === 3) {
          const p = b.phase === "hold" ? ease(clamp01((b.local - 0.22) / 0.46)) : 0;
          movingCan.position.x = -0.10 - p * 0.32;
          movingCan.position.z = -0.21 - p * 0.03;
          movingCan.position.y = TT + 0.0525 + Math.sin(p * Math.PI) * 0.05;
          /* Claude's arm follows it — cause and reaction, in sequence */
          claude.userData.armL.rotation.x = -0.42 - Math.sin(p * Math.PI) * 0.5;
        } else if (b.index > 3) {
          movingCan.position.set(-0.42, TT + 0.0525, -0.24);
        }

        /* READ 5 — Claude looks at the piles, then at the human, then down.
           The reaction IS the read, so it gets the time. */
        if (b.index === 4 && b.phase === "hold") {
          const l = b.local;
          const toHuman = clamp01((l - 0.28) / 0.22) - clamp01((l - 0.68) / 0.24);
          claude.userData.head.rotation.y = -0.5 * toHuman;
          claude.userData.head.rotation.x = 0.26 - 0.3 * toHuman;
        }

        /* READ 6 — both heads turn to the window. The film ends on the turn. */
        if (b.index === 5) {
          const p = b.phase === "hold" ? ease(clamp01((b.local - 0.12) / 0.34)) : 0;
          claude.userData.head.rotation.y = -0.5 * p - 0.1;
          claude.userData.head.rotation.x = 0.1 * (1 - p);
          human.userData.head.rotation.y = 0.62 * p;
          claude.rotation.y = -Math.PI * 0.46 - 0.22 * p;
        }

        /* the lamp is a flame, not a bulb — seeded flicker, deterministic */
        const fl = 0.93 + Math.sin(time * 11.3) * 0.035 + Math.sin(time * 6.7 + 1.1) * 0.028;
        lamp.intensity = 9.5 * fl;
        bulb.material.color.setRGB(1 * fl, 0.85 * fl, 0.63 * fl);

        composer.render();
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
